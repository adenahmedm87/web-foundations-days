<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load users from the server and search by name.</p>
    </header>

    <main>
      <button id="load-users" type="button">Load users</button>

      <p>
        <label for="filter-input">Filter users by name</label>
        <input
          id="filter-input"
          type="search"
          placeholder="Type a name..."
        >
      </p>

      <p id="status" role="status" aria-live="polite">
        Click Load users to begin.
      </p>

      <ul id="users-list"></ul>
    </main>

    <footer>
      <p>&copy; 2026 Aden — Day 5 assignment.</p>
    </footer>
  </body>
</html>
